<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
.wrap{position:relative;height:100%;display:grid;grid-template-columns:1fr 1fr;align-content:center;justify-items:center;row-gap:3vh}
.bg{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
.bg.ara{left:0;background:linear-gradient(160deg,#1c1c1c,#050505 60%,#000);animation:inL 1.1s cubic-bezier(.2,.8,.2,1) both}
.bg.dex{right:0;background:linear-gradient(200deg,#5c000d,#1c0004 55%,#030001);animation:inR 1.1s cubic-bezier(.2,.8,.2,1) both}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(50px);animation:drift 16s ease-in-out infinite alternate}
.ara .blob{background:radial-gradient(circle,rgba(255,255,255,.2),transparent 65%);left:-30vmax;top:10vh}
.dex .blob{background:radial-gradient(circle,rgba(255,20,45,.5),transparent 65%);right:-30vmax;top:20vh;animation-duration:11s}
.p{position:absolute;left:0;top:0;width:3px;height:3px;border-radius:50%;animation:rise 18s linear infinite}

.col{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2.6vh}
.orb{position:relative;width:min(42vw,34vh);aspect-ratio:1;animation:float 6s ease-in-out infinite}
.orb img{width:100%;height:100%;border-radius:50%;display:block;position:relative;z-index:2}
.orb::before{content:"";position:absolute;inset:-4%;border-radius:50%;animation:spin 5s linear infinite;-webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,#0000 calc(100% - 4px),#000 calc(100% - 3px))}
.ara .orb::before{background:conic-gradient(#0000 0,#fff 25%,#0000 50%)}
.dex .orb::before{background:conic-gradient(#0000 0,#ff1a33 25%,#0000 50%);animation-direction:reverse}
.ara .orb{animation-delay:-2s}
.ara img{animation:glowW 4s ease-in-out infinite}
.dex img{animation:glowR 2.4s ease-in-out infinite}
.btn{display:inline-flex;align-items:center;gap:.6em;padding:1.1vh 4vw;border-radius:999px;text-decoration:none;font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:clamp(12px,2.4vh,19px);letter-spacing:.03em;transition:transform .25s cubic-bezier(.2,.9,.3,1.4),box-shadow .25s;animation:pop2 .8s 1.1s both}
.btn svg{width:1.5em;height:1.5em;fill:currentColor;flex:none}
.btn:hover{transform:translateY(-3px) scale(1.06)}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ara .btn{background:linear-gradient(#fff,#bdbdbd);color:#000;box-shadow:0 0 22px rgba(255,255,255,.35)}
.ara .btn:hover{box-shadow:0 0 38px rgba(255,255,255,.7)}
.dex .btn{background:linear-gradient(#ff2a45,#a1001a);color:#fff;box-shadow:0 0 22px rgba(255,20,45,.5)}
.dex .btn:hover{box-shadow:0 0 40px rgba(255,20,45,.95)}
.title{grid-column:1/-1;position:relative;z-index:6;white-space:nowrap;font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:min(14vw,13vh);line-height:1.05;letter-spacing:.02em;color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(100deg,#0000 42%,rgba(255,255,255,.95) 50%,#0000 58%),linear-gradient(90deg,#d8d8d8 0 50%,#ff1a33 50% 100%);background-size:250% 100%,100% 100%;background-repeat:no-repeat;animation:pop 1s .6s cubic-bezier(.2,.9,.3,1.3) both,shine 4s 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 14px rgba(0,0,0,.8))}
@keyframes inL{from{transform:translateX(-100%)}}
@keyframes inR{from{transform:translateX(100%)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes pop2{from{opacity:0;transform:translateY(14px)}}
@keyframes shine{0%{background-position:130% 0,0 0}60%,100%{background-position:-60% 0,0 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-1.2vh)}}
@keyframes drift{to{transform:translate(12vw,8vh) scale(1.2)}}
@keyframes rise{to{transform:translateY(-100vh)}}
@keyframes glowW{50%{box-shadow:0 0 70px 8px rgba(255,255,255,.5)}0%,100%{box-shadow:0 0 30px 2px rgba(255,255,255,.2)}}
@keyframes glowR{50%{box-shadow:0 0 80px 12px rgba(255,20,45,.7)}0%,100%{box-shadow:0 0 30px 2px rgba(255,20,45,.25)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
